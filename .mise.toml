# .mise.toml — tool versions + task orchestration
#
# mise is the SOLE entry point for all build, test, lint, and format tasks.
# Package-level scripts (pnpm build, pnpm test) exist for mise to call;
# developers run `mise run <task>`, never `pnpm -r build` directly.
#
# Convention:
#   - Top-level tasks (build, test, lint, format) aggregate sub-tasks
#   - Sub-tasks are namespaced: build:core, build:sdk, build:cli, build:app
#   - `depends` encodes the dependency graph; mise handles ordering
#   - `dir` scopes each task to its project directory
#   - pnpm workspace handles JS dependency resolution (`workspace:*`)
#   - Elixir deps are separate (mix deps.get)
#
min_version = "2025.1"

[tools]
erlang = "28.3.1"
elixir = "1.19-otp-28"
node = { version = "22", postinstall = "corepack enable" }

# ── Dependencies ──────────────────────────────────────────────

[tasks."deps:elixir"]
description = "Install Elixir dependencies"
dir = "opal"
run = "mix deps.get"

[tasks."deps:node"]
description = "Install all JS workspace packages"
run = "pnpm install"

[tasks.deps]
description = "Install all dependencies (Elixir + JS)"
depends = ["deps:*"]

# ── Build pipeline ────────────────────────────────────────────
#
# build:core → codegen → build:sdk → build:cli
#                                   → build:app

[tasks."build:core"]
description = "Compile Elixir core"
dir = "opal"
run = "mix compile --warnings-as-errors"

[tasks.codegen]
description = "Generate TS types from Elixir protocol definitions"
dir = "opal"
depends = ["build:core"]
run = "mix run ../scripts/codegen_ts.exs"

[tasks."codegen:check"]
description = "Verify generated TS types are up-to-date"
dir = "opal"
depends = ["build:core"]
run = "mix run ../scripts/codegen_ts.exs --check"

[tasks."build:sdk"]
description = "Compile TypeScript SDK"
dir = "packages/opal-sdk"
depends = ["codegen"]
run = "pnpm build"

[tasks."build:cli"]
description = "Compile TypeScript CLI"
dir = "cli"
depends = ["build:sdk"]
run = "pnpm build"

[tasks."build:app"]
description = "Build desktop app (Electron + React)"
dir = "app"
depends = ["build:sdk"]
run = "pnpm build"

[tasks.build]
description = "Full build: core → codegen → SDK → CLI + App"
depends = ["build:cli", "build:app"]

# ── Test ──────────────────────────────────────────────────────

[tasks."test:core"]
description = "Run Elixir tests"
dir = "opal"
run = "mix test"

[tasks."test:sdk"]
description = "Run SDK tests"
dir = "packages/opal-sdk"
run = "pnpm test"

[tasks."test:cli"]
description = "Run CLI tests"
dir = "cli"
run = "pnpm test"

[tasks.test]
description = "Run all tests (parallel via wildcard)"
depends = ["test:*"]

# ── Lint ──────────────────────────────────────────────────────

[tasks."lint:core"]
description = "Check Elixir formatting and dialyzer"
dir = "opal"
run = ["mix format --check-formatted", "mix dialyzer"]

[tasks."lint:sdk"]
description = "Format-check and typecheck SDK"
dir = "packages/opal-sdk"
run = ["pnpm format:check", "pnpm typecheck"]

[tasks."lint:cli"]
description = "ESLint + format-check CLI"
dir = "cli"
run = ["pnpm lint", "pnpm format:check"]

[tasks."lint:app"]
description = "Format-check and typecheck desktop app"
dir = "app"
run = ["pnpm format:check", "pnpm typecheck"]

[tasks.lint]
description = "Lint all projects (parallel via wildcard)"
depends = ["lint:*"]

# ── Format ────────────────────────────────────────────────────

[tasks."format:core"]
description = "Format Elixir code"
dir = "opal"
run = "mix format"

[tasks."format:sdk"]
description = "Format SDK code"
dir = "packages/opal-sdk"
run = "pnpm format"

[tasks."format:cli"]
description = "Format + fix-lint CLI code"
dir = "cli"
run = ["pnpm lint:fix", "pnpm format"]

[tasks."format:app"]
description = "Format desktop app code"
dir = "app"
run = "pnpm format"

[tasks.format]
description = "Format all projects (parallel via wildcard)"
depends = ["format:*"]

# ── Dev ───────────────────────────────────────────────────────

[tasks.dev]
description = "Build and launch the CLI in dev mode"
depends = ["build"]
run = "node cli/dist/bin.js --expose opal#opal"

[tasks."app:dev"]
description = "Launch desktop app with HMR (electron-vite dev)"
dir = "app"
depends = ["build:sdk"]
run = "pnpm dev"

[tasks.server]
description = "Start opal-server standalone with Erlang distribution"
dir = "opal"
run = "elixir --sname opal -S mix run --no-halt"

[tasks.inspect]
description = "Connect to a running dev instance via iex --remsh"
run = "bash scripts/inspect.sh"

# ── Release & CI ──────────────────────────────────────────────

[tasks.release]
description = "Bump versions, commit, and tag (e.g. mise run release -- patch)"
run = "bash scripts/release.sh"

[tasks.precommit]
description = "Full CI preflight: deps → codegen check → lint → build → test"
depends = ["deps"]
run = [
  "mise run codegen:check",
  "mise run lint",
  "mise run build",
  "mise run test",
]